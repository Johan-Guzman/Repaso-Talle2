# =============================================================================
# Taller Evaluativo 2 - Fase 3: Orquestación del Ecosistema CI/CD
# Jenkins (orquestador) + smee-client (relay de webhooks de GitHub)
#
# Complete los TODOs
# =============================================================================

services:
  jenkins:
    build: .
    container_name: jenkins
    networks:
      - cicd_network
    ports:
      - "${JENKINS_UI_PORT:-9082}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
  smee:
    build: ./smee
    container_name: smee-client
    environment:
      - SMEE_URL=${SMEE_URL:-https://smee.io/z3sRzhbeAOXwAF}
    networks:
      - cicd_network
    depends_on:
      - jenkins

networks:
  cicd_network:
    name: cicd_network

volumes:
  jenkins_home: {}
