# =============================================================================
# Taller Evaluativo 2 - Despliegue de StudyTrack (backend + frontend)
#
# Este stack es el que el Jenkinsfile ejecuta en su etapa "Deploy & Smoke
# Test" (Fase 4), usando las imágenes que la etapa "Publish to Nexus"
# acaba de publicar en su Docker Registry hosted.
#
# Complete los TODOs: red compartida, healthcheck del backend y la
# condición de arranque del frontend.
# =============================================================================
version: "3.9"

services:
  backend:
    # TODO: Update image with Nexus registry and tag
    image: localhost:5000/studytrack-api:1.0.0
    container_name: studytrack-backend
    ports:
      - "8080:8080"
    networks:
      - product-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s 

  frontend:
    # TODO: Update image with Nexus registry and tag
    image: localhost:5000/studytrack-frontend:1.0.0
    container_name: studytrack-frontend
    ports:
      - "80:80"
    networks:
      - product-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  # Shared network for backend and frontend communication
  product-network:
    driver: bridge 
